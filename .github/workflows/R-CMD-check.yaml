# Based on r-lib/actions v2 check-standard. Linux supports the existing fork backend.
name: R-CMD-check
on:
  push:
    branches: [v0.2-development]
  pull_request:
    branches: [v0.2-development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
      - name: Install JAGS
        run: sudo apt-get update && sudo apt-get install -y jags
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          # Existing missing help pages remain visible; this phase does not author docs.
          error-on: '"error"'
